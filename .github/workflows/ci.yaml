name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and format check
        run: npm run lint:ci
      - name: Types check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build app
        run: npm run build

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/evgpov/articles-prisma:latest
      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/evgpov/articles-prisma-migrate:latest
